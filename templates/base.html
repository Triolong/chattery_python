<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
          integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
          crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='chat2-64.ico') }}">
    <title>{{ title }}</title>
</head>
    <body>
        <header>
            <nav class="navbar navbar-light bg-light">
                <a class="navbar-brand" href="/"><h1>Chattery</h1></a>
                {% if current_user.is_authenticated %}
                    <a class="navbar-brand" href="/profile/{{ current_user.id }}">{{ current_user.name }}</a>
                    <a class="btn btn-danger" href="/logout">Log out</a>
                {% else %}
                    <p>
                        <a class="btn btn-primary " href="/register">Sign in</a>
                        <a class="btn btn-success" href="/login">Log in</a>
                    </p>
                {% endif %}
            </nav>
        </header>
        <main role="main" class="container">
            {% block content %}{% endblock %}
        </main>
    </body>
</html>
