{% extends "base.html" %}

{% block content %}
    <h1>{{ room.label }} - Collaborators:</h1>
    <hr>
    <ul>
        {% for collaborator in collab_list %}
            <li><a class="collaborator-link" href="/profile/{{ collaborator.id }}">{{ collaborator.name }}</a></li>
        {% endfor %}
    </ul>
{% endblock %}
